version: '3.7'
services:
  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: mysql_app_1
    restart: always
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hkt_shop
      MYSQL_ROOT_PASSWORD: phamminhbien123
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - dbdata:/var/lib/mysql/
      - ./php/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: php-fpm
    container_name: app_php
    restart: always
    tty: true
    environment:
      SERVICE_NAME: app_php
      SERVICE_TAGS: dev
    ports:
      - "9000:9000"
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: project_webserver-app_php
    restart: always
    tty: true
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www
      - ./php/conf:/etc/nginx/conf.d
      - ./php/nginx/nginx.conf:/etc/nginx/nginx.conf:cached
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
